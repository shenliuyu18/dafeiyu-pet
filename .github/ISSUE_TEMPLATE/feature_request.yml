name: 功能建议
description: 想要的新功能、交互改进或体验优化
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便，或者在什么场景下需要它
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 如果有具体交互或界面想法，可以写在这里
  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 桌宠形象 / 动作
        - 气泡 / 台词 / 表情
        - 白饭账本
        - 番茄钟 / 专注统计
        - 设置 / 界面语言
        - 启动 / 更新
        - 形象包 / 自制形象
        - 其他
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 试过或考虑过的其他做法