name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows 构建与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 版本号一致性检查
        shell: pwsh
        run: |
          $pkg = node -p "require('./package.json').version"
          $lock = node -p "require('./package-lock.json').version"
          $go = (Select-String -Path wails/main.go -Pattern 'var Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($pkg -ne $go -or $pkg -ne $lock) {
            Write-Error "版本不一致：package.json=$pkg package-lock.json=$lock wails/main.go=$go"
            exit 1
          }
          Write-Host "版本一致：$pkg"

      - name: 脚本语法检查
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath renderer -Recurse -Filter '*.js' -File)
          if ($files.Count -eq 0) { throw 'renderer 下未找到 JavaScript 文件' }
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "已检查 renderer 下 $($files.Count) 个 JavaScript 文件"
          node --check wails/frontend/api.js
          python -c "import ast,glob;[ast.parse(open(f,encoding='utf-8').read(),f) for f in glob.glob('tools/*.py')+glob.glob('tools/character-pack/*.py')]"

      - name: 安装前端工具链
        run: npm ci --no-audit --no-fund

      - name: 前端类型检查
        run: npm run typecheck

      - name: 前端单元测试
        run: npm run test:frontend

      # wails/frontend/dist 是 go:embed 的依赖，必须先由脚本生成
      - name: 生成前端资源
        run: node tools/wails-prepare.js

      # 依赖 dist（断言不能残留 ../characters/），必须放在生成之后
      - name: Renderer 烟雾测试
        run: npm run test:smoke

      - name: gofmt 检查
        working-directory: wails
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Error "以下 Go 文件未格式化：`n$files"
            exit 1
          }

      - name: go vet
        working-directory: wails
        run: go vet ./...

      - name: go test
        working-directory: wails
        run: go test ./...

      - name: 编译校验
        working-directory: wails
        run: go build -o "${{ runner.temp }}/dafeiyu-pet.exe" .




