name: Release

# 打 tag（如 v1.4.8）即自动出完整版 + Lite 版安装包并创建 Release。
# 版本号请先改 package.json，再打同名 tag；tag 与 package.json 不一致会直接失败。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（例如 v1.6.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    env:
      # 素材脚本会打印中文文件名，CI 的 Python 默认 cp1252 会抛 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      # 可选：配置后自动给 SHA256SUMS.txt 签名，并在构建时注入公钥
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      UPDATE_SIGNING_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBKEY }}
      # 手动触发时用输入的 tag，push tag 时用 ref_name
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: 安装 NSIS 与 Python 依赖
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # 必须用同一个 python 装 Pillow，否则 build-lite-assets.py 可能落到没有 Pillow 的解释器
          python -m pip install --upgrade pip pillow
          python -c "import PIL, sys; print('python', sys.executable); print('pillow', PIL.__version__)"

      - name: 确认 ffmpeg 与 libvpx-vp9 编码器
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          $enc = ffmpeg -hide_banner -encoders 2>&1 | Select-String -Pattern "libvpx-vp9"
          if (-not $enc) { Write-Error "ffmpeg 缺少 libvpx-vp9，Lite 素材无法压缩"; exit 1 }
          $enc

      - name: 校验 tag 与版本号
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "$env:TAG".TrimStart('v')
          if (-not $tag) {
            Write-Error "没有拿到 tag；手动触发时请在输入框填写完整 tag（例如 v1.6.0）"
            exit 1
          }
          if ($pkg -ne $tag) {
            Write-Error "tag $tag 与 package.json 版本 $pkg 不一致"
            exit 1
          }
          Write-Host "发布版本：$tag"

      - name: 构建完整版
        run: npm run build

      # Lite 依赖 ffmpeg 的 VP9 编码，环境差异会导致失败；
      # 不让它阻断完整版的发布，失败时 Release 里就只挂完整版
      - name: 构建 Lite 版
        id: lite
        continue-on-error: true
        run: npm run build:lite

      - name: Lite 构建结果
        shell: pwsh
        run: |
          if ("${{ steps.lite.outcome }}" -ne "success") {
            Write-Warning "Lite 版构建失败（完整版不受影响，仍会发布）"
          }

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: 生成校验和
        shell: pwsh
        run: |
          Get-ChildItem dist/*-setup.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8NoBOM dist/SHA256SUMS.txt

      - name: 可选：签名校验清单
        run: node tools/sign-update.js dist/SHA256SUMS.txt

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
          generate_release_notes: true
          # 带 -beta / -rc 的 tag 自动标为预发布
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: false
