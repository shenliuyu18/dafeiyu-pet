<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>配置 API Key</title>
<style>
  body { margin: 0; padding: 16px 18px; font-family: "Microsoft YaHei UI", system-ui, sans-serif; background: #f7f9ff; color: #22305e; font-size: 13px; }
  h1 { margin: 0 0 8px; font-size: 15px; }
  .warn { margin: 0 0 10px; padding: 6px 8px; border: 1px solid #ffd6d0; border-radius: 8px; background: #fff4f2; color: #b4453a; font-size: 11px; line-height: 1.5; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #dde4ff; border-radius: 8px; font: inherit; outline: none; }
  input:focus { border-color: #4d6bfe; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 7px 0; border: 1px solid #dde4ff; border-radius: 8px; background: #f4f7ff; color: #33406e; font: inherit; cursor: pointer; }
  button.primary { flex: 1.4; border: 0; background: #4d6bfe; color: #fff; }
  button:hover { filter: brightness(0.97); }
  #status { margin-top: 8px; font-size: 11px; color: #5b688f; min-height: 14px; }
  .hint { margin: 0 0 6px; font-size: 11px; color: #5b688f; }
</style>
</head>
<body>
  <h1 id="title">配置 API Key</h1>
  <div class="warn">⚠️ Key 会用 Windows 系统加密（DPAPI）后保存在本机状态文件，查询账单时只发送给该平台官方接口。请勿在共用电脑上填写，风险自负。</div>
  <div class="hint" id="hint"></div>
  <input id="key" type="password" placeholder="粘贴 API Key（例如 sk-...）" autocomplete="off" spellcheck="false">
  <div class="row">
    <button id="save" class="primary">保存</button>
    <button id="clear">清除已存 Key</button>
    <button id="cancel">取消</button>
  </div>
  <div id="status"></div>
  <script src="key.js"></script>
</body>
</html>
